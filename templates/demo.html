<!-- Home Page: https://www.digiclipsproject.com/ -->
<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Podcast Results</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='{{ url_for("static", filename="podcast.search.component.css") }}'>
    <style>
                .podcast-result {
                    display: flex;
                    flex-direction: row;
                    align-items: flex-start;
                    margin: 16px auto 32px auto;
                    background: #fff;
                    border-radius: 12px;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
                    padding: 20px;
                    max-width: 900px;
                }
                .podcast-left {
                    flex: 1;
                    min-width: 0;
                    max-width: 420px;
                }
                .podcast-player {
                    width: 100%;
                    max-width: 700px;
                }
                .podcast-description {
                    margin-top: 25px;
                    font-size: 18px;
                    color: #333;
                }
                .podcast-info {
                    display: flex;
                    flex-direction: row;
                    gap: 24px;
                    margin-top: 8px;
                    font-size: 16px;
                    color: #555;
                }
                .podcast-info span {
                    display: flex;
                    align-items: center;
                    gap: 6px;
                }
                .podcast-right {
                    display: flex;
                    flex-direction: column;
                    align-items: flex-middle; /*flex-end*/
                    margin-left: 265px;
                }
                .results-line-nav {
                    display: flex;
                    flex-direction: row;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 12px;
                    width: 100%;
                }
                .results-line-actions {
                    display: flex;
                    flex-direction: column;
                    gap: 12px;
                }
        body {
            background: #f4f4f4;
        }
        .search-section {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            padding: 32px 24px;
            margin: 32px auto 24px auto;
            max-width: 900px;
        }
        .results-section {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            padding: 32px 24px;
            margin: 0 auto 32px auto;
            max-width: 900px;
        }
        .btn-primary {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 8px 18px;
            font-size: 15px;
            border-radius: 10px;
            margin: 4px;
            transition: background 0.2s, color 0.2s;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            color: #fff;
        }
        .results-line-actions .btn,
        .results-line-nav .btn-outline {
            background-color: #fff;
            color: #333;
            border: 2px solid #ccc;
            padding: 8px 14px;
            font-size: 15px;
            border-radius: 8px;
            margin: 4px;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            cursor: pointer;
        }
        /* Card buttons: match search button shape and hover behavior */
        .podcast-result button,
        .podcast-result .results-line-actions .btn,
        .podcast-result .btn-outline,
        .podcast-result .seg-btn,
        .podcast-result .back-to-results-button {
            padding: 8px 25px;
            border-radius: 8px;
            border: 2px solid #ccc;
            background: #fff;
            color: #333;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .podcast-result button:hover,
        .podcast-result .results-line-actions .btn:hover,
        .podcast-result .btn-outline:hover,
        .podcast-result .seg-btn:hover,
        .podcast-result .back-to-results-button:hover,
        .results-line-nav .btn-outline:hover {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }
        /* Center the basic search bar */
        .basic-search {
          display: flex;
          justify-content: center;
          margin: 16px 0 24px 0;
        }
        .basic-search .search-wrapper {
          display: flex;
          gap: 12px;
          align-items: center;
          justify-content: center;
          width: 100%;
          max-width: 720px;
          padding: 6px 8px;
        }
        .basic-search .search-wrapper input[type="text"],
        .basic-search .search-wrapper select,
        .basic-search .search-wrapper input[type="date"] {
          padding: 8px 12px;
          border-radius: 8px;
          border: 1px solid #ccc;
          font-size: 15px;
        }
        .basic-search .search-wrapper .search-btn {
          padding: 8px 14px;
          border-radius: 8px;
          border: none;
          background: #007bff;
          color: #fff;
          cursor: pointer;
        }
        .basic-search .search-wrapper .search-btn:hover {
          background: #0056b3;
        }
                /* Page title */
                .page-title {
                        text-align: center;
                        font-size: 32px;
                        font-weight: 600;
                        margin: 18px 0 10px 0;
                        color: #222;
                }
    </style>
    <script src='main.js'></script>
</head>
<body>
    <h1 class="page-title">🎙️ Podcast Search - DEMO (UNDER CONSTRUCTION)</h1>
    <a href="../index.html">
        <button class="search-btn">LATEST MOCKUP HERE!</button>
    </a>

    <div class="basic-search">
      <div class="search-wrapper">
        <form action="/" method="POST">
            <input type="text" id="search_query" name="search_query" placeholder="Search podcast segments..." />
            <select>
              <option>Podcast App</option>
            </select>
            <input type="date">
            <button type="submit" class="search-btn">Search</button>
        </form>
      </div>

    </div>

    <div class="results-section">

        {% if query %}
      <p><strong>Saved search query:</strong> {{ query }}</p>
      {% endif %}

      <div class="results-line-nav">
          <button class="btn-outline"><a href="undr-constr.html">⬅️ Previous Podcast</a></button>
          <button class="btn-outline">Next Podcast ➡️</button>
      </div>

      <div class="podcast-result">
          <div class="podcast-left">
              <div class="podcast-image-wrapper">
                  <img
                      class="podcast-detail-image"
                      src="{{ url_for('static', filename='podcast-cover.png') }}"
                      alt="Podcast Image"
                  />
              </div>

              <audio controls class="podcast-player">
                  <source src="#" type="audio/mpeg">
              </audio>

              <h3 class="podcast-title"><a href="https://podcast.app/">TITLE</a></h3>

              <div class="podcast-info">
                  <span>🎙️ Podcast App</span>
                  <span>📅 ??? 00, 0000 - 00:00</span>
                  <span>⏱ 0m 0s</span>
              </div>
          </div>

          <div class="podcast-right">
              <div class="results-line-actions">
                  <button class="btn-outline"><a href="undr-constr.html">⬇️ Download Media</a></button>
                  <button class="btn-outline"><a href="undr-constr.html">✏️ Edit Media</a></button>
                  <button class="btn-outline"><a href="undr-constr.html">📊 Media Analytics</a></button>
                  <button class="btn-outline"><a href="https://www.digiclipsproject.com/subscriber/mediatransfer">⇄ Media Transfer</a></button>
              </div>
          </div>
      </div>

      <p class="podcast-description">
          Description...
      </p>


    </div>
</body>
</html>
